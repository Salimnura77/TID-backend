name: Prepare pilot release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested pilot image to GHCR (requires repository opt-in)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pilot-release
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish tested pilot image
    needs: verify
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: container-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require explicit repository opt-in
        env:
          ENABLED: ${{ vars.TRUEID_ENABLE_IMAGE_PUBLISH }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo 'Publishing is disabled. Configure the protected environment and explicitly enable TRUEID_ENABLE_IMAGE_PUBLISH first.'
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.image-artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error
      - name: Verify and load the tested image, without rebuilding
        run: |
          cd release
          sha256sum --check image.tar.sha256
          docker load --input image.tar
          test "$(docker image inspect --format '{{.Id}}' "trueid-backend:$GITHUB_SHA")" = "$(cat image-id.txt)"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "trueid-backend:$GITHUB_SHA")" = "$GITHUB_SHA"
      - name: Publish commit tag and record pull-by-digest reference
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/backend:sha-$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "trueid-backend:$GITHUB_SHA" "$IMAGE"
          docker push "$IMAGE"
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          printf 'Tested pilot image: `%s`\n\nNo application deployment was performed.\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry session
        if: always()
        run: docker logout ghcr.io
